{
  "entryPoints": {
    "web": {
      "address": ":80",
      "http": {
        "redirections": {
          "entryPoint": {
            "to": "websecure",
            "scheme": "https"
          }
        }
      }
    },
    "websecure": {
      "address": ":443"
    }
  },
  "providers": {
    "docker": {
      "exposedByDefault": false,
      "constraints": "Label(`com.docker.compose.project`, `varcamp`)",
      "network": "varcamp_core",
      "useBindPortIP": false
    }
  },
  "certificatesResolvers": {
    "letsencrypt": {
      "acme": {
        "email": "SET_BY_PRIVATE_PROVISIONING",
        "storage": "/letsencrypt/acme.json",
        "httpChallenge": {
          "entryPoint": "web"
        }
      }
    }
  },
  "log": {
    "level": "WARN"
  }
}
