services:
  npc:
    image: node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5
    command: [node, /app/server.mjs]
    user: node
    read_only: true
    init: true
    restart: unless-stopped
    env_file: /srv/varcamp/private/npc.env
    volumes:
      - /srv/varcamp/npc/server.mjs:/app/server.mjs:ro
    tmpfs: ['/tmp:size=8m,noexec,nosuid']
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    networks: [core]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/varcamp-npc/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      traefik.enable: 'true'
      traefik.docker.network: varcamp_core
      traefik.http.routers.varcamp-npc.rule: Host(`varcamp.3-1-133-135.sslip.io`) && PathPrefix(`/varcamp-npc/`)
      traefik.http.routers.varcamp-npc.priority: '100'
      traefik.http.routers.varcamp-npc.entrypoints: websecure
      traefik.http.routers.varcamp-npc.tls.certresolver: letsencrypt
      traefik.http.routers.varcamp-npc.service: varcamp-npc
      traefik.http.services.varcamp-npc.loadbalancer.server.port: '3000'
networks:
  core:
    external: true
    name: varcamp_core
