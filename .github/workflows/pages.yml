name: Publish VarCamp maps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.8.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate native maps
        run: npm run maps:validate
      - name: Verify artwork and attribution
        run: npm run art:check
      - name: Refresh previews while preserving native maps
        run: npm run maps:build
      - name: Build the complete map release
        run: npm run buildmap
      - name: Test release and source contracts
        # The one excluded test requires the separately installed macOS Tiled
        # rasterizer. All other tests, including native map validation, run here.
        run: >-
          npm test -- --maxWorkers=1 --testTimeout=30000
          --testNamePattern='^(?!.*\brenders all 12 PNG cells in native order through nested tile layers$).*'
      - name: Add the venue landing page and preserve the legacy map URL
        run: |
          cp publication/index.html dist/index.html
          mkdir -p dist/publication
          cp publication/*.jpg dist/publication/
          cp varcamp.tmj tileset.png dist/
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified maps
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: '240000'
